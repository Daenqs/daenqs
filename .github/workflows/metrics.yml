name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          base: header, activity, community, repositories, metadata
          filename: metrics.svg
          config_timezone: Europe/Istanbul
          config_display: large
          config_output: svg

          # İzometrik katkı takvimi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # En çok kullanılan diller
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Eklenen/silinen satır sayıları
          plugin_lines: yes
          plugin_lines_sections: base

          # Öne çıkan katkılar
          plugin_notable: yes
          plugin_notable_from: all

      # Footer'ı SVG'den tamamen sil
      - name: Remove footer from SVG
        run: |
          sed -i '/<footer>/,/<\/footer>/d' metrics.svg

      - name: Commit cleaned SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update metrics"
          file_pattern: metrics.svg
