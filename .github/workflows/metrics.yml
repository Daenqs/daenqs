name: Metrics

on:
  # Her gün otomatik güncelle (UTC 00:00)
  schedule: [{cron: "0 0 * * *"}]
  # Actions sekmesinden manuel çalıştırma
  workflow_dispatch:
  # Push yapınca da çalışsın
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Genel ayarlar
          template: classic
          base: header, activity, community, repositories, metadata
          filename: metrics.svg
          config_timezone: Europe/Istanbul
          config_display: large
          
          # "These metrics include private contributions..." footer yazısını tamamen gizle
          config_output: svg
          extras_css: |
            .footer, footer, [id*="notice"], [class*="notice"] {
              display: none !important;
            }

          # ═══════════════════════════════════════
          # İzometrik katkı takvimi (3D yeşil bloklar)
          # ═══════════════════════════════════════
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ═══════════════════════════════════════
          # En çok kullanılan diller
          # ═══════════════════════════════════════
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # ═══════════════════════════════════════
          # Eklenen/silinen satır sayıları
          # ═══════════════════════════════════════
          plugin_lines: yes

          # ═══════════════════════════════════════
          # Kod alışkanlıkları (saat dağılımı vs.)
          # ═══════════════════════════════════════
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes

          # ═══════════════════════════════════════
          # Commit streak bilgileri
          # ═══════════════════════════════════════
          plugin_achievements: yes
          plugin_achievements_display: compact

          # ═══════════════════════════════════════
          # Öne çıkan katkılar
          # ═══════════════════════════════════════
          plugin_notable: yes
          plugin_notable_from: all
